# Structural schema for BuildProposal records (interpreted by
# tools/verify_construction.py — see construction/ALGEBRA.md).
record_kind: build_proposal
id_pattern: "BUILD-[0-9]{3}"
required:
  proposal: str
  phase: int
  goal: str
  allowed_scope: list[str]
  prediction: map[str]
  non_claims: list[str]
  budget: map
budget_required:
  max_files_changed: int
# Optional keys (interpreted by the verifier when present):
#   mechanism: str        — preregistered implementation mechanism
#   probes: list[str]     — names of probes in tools/probes.yaml
#     Probes are experiments (E_B), resolved exclusively through the
#     law-controlled registry and executed in an ephemeral detached
#     worktree; results enter the derived vocabulary as probe_<name>
#     (BUILD-001 measurement law; BUILD-002 governance closure).
#     Inline {name, cmd, expect_exit} specs are unlawful from BUILD-002;
#     BUILD-001's inline record is grandfathered but must agree with the
#     registry to execute.
