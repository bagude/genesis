# Structural schema for BuildProposal records (interpreted by
# tools/verify_construction.py — see construction/ALGEBRA.md).
record_kind: build_proposal
id_pattern: "BUILD-[0-9]{3}"
required:
  proposal: str
  phase: int
  goal: str
  allowed_scope: list[str]
  prediction: map[str]
  non_claims: list[str]
  budget: map
budget_required:
  max_files_changed: int
# Optional keys (interpreted by the verifier when present):
#   mechanism: str        — preregistered implementation mechanism
#   probes: list of {name: str, cmd: str, expect_exit: int}
#     Probes are EXECUTED by tools/verify_construction.py; their results
#     enter the derived vocabulary as probe_<name> and are never taken
#     from the builder's narrative (BUILD-001 measurement law).
