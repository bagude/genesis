unexpected:
  - >
    attempt 4 executed the repaired mechanism and was rejected at
    SUCCESSOR_CANONICAL_VIABLE — the gate this transition introduces —
    exposing a FIXED-POINT defect in the candidate's own law: the
    receipt cannot name the canonical-viability evidence, because that
    evidence is derived from the staged state containing the receipt.
    Amendment 4 froze the resolution: canonical viability is EXTERNAL
    and DERIVED, searched from the evidence chain by matching
    staged_state_commit to the accepted state, reported and never
    asserted from the receipt. No authority was transferred
  - >
    attempt 3 was aborted by an executor procedural error (the ceremony
    ran the accepted-state promoter instead of the candidate's repaired
    one); the state it produced was rejected by its own ledger law,
    which is itself a demonstration of why AUDIT-006 Obligation 4
    matters. Origin was never advanced; amendment 3 froze the ceremony
    execution locus
  - >
    attempt 1 was rejected at PARENT_ADMITTED because the grounding
    asserted a new derived key in the transition that introduces it,
    violating BUILD-004's law-evolution rule; candidate code was never
    executed, proving the ordering gate holds
  - >
    attempt 2 passed both earlier gates but was rejected at
    SUCCESSOR_CANONICAL_VIABLE as UNEVALUABLE: the staged state was a
    dangling commit and `git clone --no-local` transfers only
    ref-reachable objects. Option A therefore requires the staged state
    to be REF-REACHABLE yet NON-CANONICAL; a staging branch, created
    for the evaluation window and deleted afterwards, was frozen in
    bootstrap amendment 2. Under the pre-BUILD-007 architecture this
    defect would have been discovered only AFTER promotion — the gate
    AUDIT-006 required is what caught it, with no authority transferred
  - >
    the setuid_binary_elevation probe is adversarial rather than
    vacuous: real setuid binaries (/usr/bin/su, /bin/su, /usr/bin/sudo)
    ARE reachable inside the realm through the read-only host mounts,
    and the probe measures that none of them yields uid 0 — the denial
    comes from no_new_privs plus nosuid, not from the binaries being
    absent
  - >
    the anti-regression for AUDIT-006 Finding 2 was implemented as LAW
    rather than as a claim: V_B calls selftest_probe_semantics.run() on
    every invocation (pure computation, no execution, R_B-safe) and
    fails the ledger if a visible parent, an ERROR/INCONCLUSIVE
    outcome, a missing probe result, an inert realm, or a weakened
    privilege contract could ever certify; the same self-test is also
    registered in tools/probes.yaml for E_B execution by later
    proposals
  - >
    Option A staging required one non-obvious construction: the receipt
    cannot contain the staged commit's own sha (a commit cannot name
    itself), so the canonical-viability evidence object records
    staged_state_commit EXTERNALLY on the evidence ref, and V_B closes
    the loop by requiring that recorded state to equal the commit that
    added the receipt — this is what makes Hash(Stage) =
    Hash(FinalAcceptedState) both true and checkable
  - >
    the reported_ keys are fixed-point hypotheses; their authoritative
    counterparts are the GateResult, PayloadViability, and
    CanonicalViability evidence objects and the schema-v5 receipt, all
    certified by V_B from bound evidence rather than from assertion

