proposal: BUILD-000
phase: -1

goal: >
  Freeze the construction algebra: define what a BuildProposal is, what
  counts as admissibility, which measurements are canonical, what a
  BuildGrounding record contains, and what constitutes a realized or
  rejected construction transition. Provide the mechanical verifier that
  makes these definitions law rather than narrative.

