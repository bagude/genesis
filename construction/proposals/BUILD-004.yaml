  proposal_precedence_BUILD-004: PASS
  scope_conformance_BUILD-004: PASS
  budget_conformance_BUILD-004: PASS
  probe_pyyaml_import: PASS
  authoritative_tree_status_preserved: PASS
  attribution_extensions: "0"
  closed_record_mutations: "0"
  open_proposals: "0"
  untracked_commits: "0"
  reported_parent_law_verdict: PASS
  reported_parent_law_expected_violations: "1"
  reported_prospective_law_verdict: PASS
  reported_evidence_object: PRESENT

probes:
  - pyyaml_import

non_claims:
  - provenance is established by evidence binding, pre-promotion remote
    chronology, and independent reproducibility — not by cryptographic
    signatures; absent platform-held secrets or branch protection, a
    fabricated ceremony narrative cannot be made physically impossible,
    but any receipt whose verdict is not reproducible under its
    declared authority, or that lacks a bound pre-promotion evidence
    object, is mechanically detected
  - capability-level promotion exclusivity remains unenforced until the
    repository owner enables branch protection; governance remains
    detection-grade and is stated as such
  - BUILD-003's records (grounding, receipt, bootstrap) remain
    immutable; its authority-identity discrepancy remains permanently
    visible as derived measurements and its receipt provenance status
    remains HISTORICAL_UNVERIFIED
  - evidence-object durability depends on the remote retaining
    refs/construction/*; mirroring evidence into a record namespace is
    deferred
  - no world ontology, model harness, surface, or ruler code; Phase 0
    (Genesis / contracts) moves to BUILD-005

deferred:
  - schema comment updates for receipt/evidence vocabulary (carried
    from BUILD-003 deferral)
  - deep re-execution of ALL historical receipts in CI (only the newest
    is reproduced per run)
  - platform branch protection and required checks (owner action)

budget:
  max_files_changed: 14
