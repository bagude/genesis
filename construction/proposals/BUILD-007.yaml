non_claims:
  - privilege monotonicity is claimed only within the declared
    capability lattice (uid/gid, no_new_privs, capability sets, nosuid
    mounts); kernel-exploit resistance, side-channel isolation, and
    VM-grade isolation are NOT claimed
  - the integrity rulers certify equality over their declared scopes
    only; untracked files, ignored paths, timestamps, and .git internals
    outside .git/objects and refs are explicitly out of scope
  - Option A staging guarantees Hash(Stage) = Hash(FinalAcceptedState)
    for THIS transition's canonical branch; it does not prevent a later
    unauthorized direct push from changing canonical afterwards
    (branch protection remains an owner action)
  - remote CI cannot construct the namespace realm; it performs
    parent-law reproduction, semantic conformance, and evidence
    integrity only, and reports the capability primitive as unavailable
    rather than claiming realm reproduction
  - chronology remains REMOTE_EVIDENCE_PRESENT with pre-promotion
    ordering UNATTESTED for all transitions
  - no world ontology, model harness, surface, or ruler code; Phase 0
    (Genesis / contracts) moves to BUILD-008

deferred:
