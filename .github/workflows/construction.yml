name: construction-law

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: R_B derives precedence, scope, and budget from
          # the commit graph, not from the checkout snapshot.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      # Evidence objects live on refs/construction/* (pushed before
      # promotion); fetch them so V_B can verify provenance.
      - run: git fetch origin '+refs/construction/*:refs/construction/*' || true
      - run: python3 tools/verify_construction.py
      # Independent reproduction of the newest receipt's parent-law
      # evaluation. CI remains attestation, not gate authority.
      - run: python3 tools/verify_construction.py --reproduce
